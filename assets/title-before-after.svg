<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From vague titles to useful titles</title>
  <desc id="desc">A fictional before and after comparison showing vague task titles becoming project-aware titles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset="1" stop-color="#8a63ff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#3c70a3" stroke-opacity=".13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00081a" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="28" fill="url(#grid)"/>
  <text x="64" y="76" fill="#f4f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">From vague to useful</text>
  <text x="64" y="111" fill="#8fa9c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Stable, project-aware titles make every task easier to find.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="148" width="450" height="402" rx="24" fill="#101f39" stroke="#334865"/>
    <rect x="690" y="148" width="450" height="402" rx="24" fill="#101f39" stroke="#2bc9e9" stroke-opacity=".7"/>
  </g>

  <rect x="84" y="174" width="92" height="30" rx="15" fill="#293a55"/>
  <text x="130" y="195" text-anchor="middle" fill="#9fb0c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">BEFORE</text>
  <rect x="714" y="174" width="82" height="30" rx="15" fill="#123b50"/>
  <text x="755" y="195" text-anchor="middle" fill="#5ce6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">AFTER</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="84" y="226" width="402" height="80" rx="17" fill="#172941"/>
      <circle cx="116" cy="266" r="11" fill="#536882"/>
      <text x="144" y="261" fill="#c2cfdd" font-size="19" font-weight="600">Untitled request</text>
      <text x="144" y="284" fill="#69809d" font-size="14">No project or outcome</text>
      <rect x="84" y="326" width="402" height="80" rx="17" fill="#172941"/>
      <circle cx="116" cy="366" r="11" fill="#536882"/>
      <text x="144" y="361" fill="#c2cfdd" font-size="19" font-weight="600">Loose follow-up</text>
      <text x="144" y="384" fill="#69809d" font-size="14">Hard to recognize later</text>
      <rect x="84" y="426" width="402" height="80" rx="17" fill="#172941"/>
      <circle cx="116" cy="466" r="11" fill="#536882"/>
      <text x="144" y="461" fill="#c2cfdd" font-size="19" font-weight="600">Old note</text>
      <text x="144" y="484" fill="#69809d" font-size="14">Opening prompt became the title</text>
    </g>

    <g>
      <rect x="714" y="226" width="402" height="80" rx="17" fill="#132b47" stroke="#1ed5f7" stroke-opacity=".25"/>
      <rect x="736" y="246" width="76" height="26" rx="13" fill="#123f55"/>
      <text x="774" y="264" text-anchor="middle" fill="#64e5fb" font-size="12" font-weight="700">AURORA</text>
      <text x="830" y="264" fill="#ecf7ff" font-size="18" font-weight="650">API comparison</text>
      <path d="M1078 253l8 8 16-18" fill="none" stroke="#63f3b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="714" y="326" width="402" height="80" rx="17" fill="#132b47" stroke="#1ed5f7" stroke-opacity=".25"/>
      <rect x="736" y="346" width="76" height="26" rx="13" fill="#2c285c"/>
      <text x="774" y="364" text-anchor="middle" fill="#b6a5ff" font-size="12" font-weight="700">STUDIO</text>
      <text x="830" y="364" fill="#ecf7ff" font-size="18" font-weight="650">Release checklist</text>
      <path d="M1078 353l8 8 16-18" fill="none" stroke="#63f3b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="714" y="426" width="402" height="80" rx="17" fill="#132b47" stroke="#1ed5f7" stroke-opacity=".25"/>
      <rect x="736" y="446" width="76" height="26" rx="13" fill="#164839"/>
      <text x="774" y="464" text-anchor="middle" fill="#77efbb" font-size="12" font-weight="700">ATLAS</text>
      <text x="830" y="464" fill="#ecf7ff" font-size="18" font-weight="650">Search quality audit</text>
      <path d="M1078 453l8 8 16-18" fill="none" stroke="#63f3b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(547 310)">
    <path d="M0 38h74" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 24l16 14-16 14" fill="none" stroke="#8a63ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 0h27l22 22-34 34L11 34V11A11 11 0 0 1 22 0z" fill="#102b49" stroke="#43defa" stroke-width="4"/>
    <circle cx="27" cy="16" r="5" fill="#8ff3ff"/>
  </g>
</svg>
