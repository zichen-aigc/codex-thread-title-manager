<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How Codex Thread Title Manager works</title>
  <desc id="desc">Four steps: read context, propose a stable title, rename through the official tool, and record recovery history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23d9ff"/>
      <stop offset="1" stop-color="#8a63ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000817" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f4f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">How it works</text>
  <text x="60" y="106" fill="#8fa9c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">One stable title lifecycle, using official Codex task tools.</text>
  <path d="M164 274H1035" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".75"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 154)">
      <rect width="250" height="272" rx="22" fill="#10223c" stroke="#304967"/>
      <circle cx="125" cy="58" r="31" fill="#113f55" stroke="#39dcf8" stroke-width="3"/>
      <path d="M111 58h28M125 44v28" stroke="#74ecff" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="116" fill="#4bdff8" font-size="13" font-weight="750" letter-spacing="1.8">01 · CONTEXT</text>
      <text x="24" y="154" fill="#f0f7ff" font-size="23" font-weight="700">Read the work</text>
      <text x="24" y="186" fill="#8fa9c8" font-size="16">Project, current objective,</text>
      <text x="24" y="211" fill="#8fa9c8" font-size="16">and latest outcome.</text>
    </g>
    <g transform="translate(335 154)">
      <rect width="250" height="272" rx="22" fill="#10223c" stroke="#304967"/>
      <circle cx="125" cy="58" r="31" fill="#232d5b" stroke="#9a7cff" stroke-width="3"/>
      <path d="M108 45h23l17 17-27 27-17-17V49a4 4 0 0 1 4-4z" fill="none" stroke="#b9a6ff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="116" cy="55" r="4" fill="#d9d0ff"/>
      <text x="24" y="116" fill="#a88cff" font-size="13" font-weight="750" letter-spacing="1.8">02 · TITLE</text>
      <text x="24" y="154" fill="#f0f7ff" font-size="23" font-weight="700">Propose stability</text>
      <text x="24" y="186" fill="#8fa9c8" font-size="16">Project or domain, then</text>
      <text x="24" y="211" fill="#8fa9c8" font-size="16">the real deliverable.</text>
    </g>
    <g transform="translate(615 154)">
      <rect width="250" height="272" rx="22" fill="#10223c" stroke="#304967"/>
      <circle cx="125" cy="58" r="31" fill="#13394a" stroke="#53e9ca" stroke-width="3"/>
      <path d="M107 61l12 12 25-30" fill="none" stroke="#70f2c3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="116" fill="#63edc2" font-size="13" font-weight="750" letter-spacing="1.8">03 · RENAME</text>
      <text x="24" y="154" fill="#f0f7ff" font-size="23" font-weight="700">Use official tools</text>
      <text x="24" y="186" fill="#8fa9c8" font-size="16">Rename only when the</text>
      <text x="24" y="211" fill="#8fa9c8" font-size="16">task boundary changes.</text>
    </g>
    <g transform="translate(895 154)">
      <rect width="250" height="272" rx="22" fill="#10223c" stroke="#304967"/>
      <circle cx="125" cy="58" r="31" fill="#2c2855" stroke="#c08bff" stroke-width="3"/>
      <path d="M112 42h26v35h-26zM118 50h14M118 58h14M118 66h10" fill="none" stroke="#d7b8ff" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="116" fill="#c29aff" font-size="13" font-weight="750" letter-spacing="1.8">04 · RECOVERY</text>
      <text x="24" y="154" fill="#f0f7ff" font-size="23" font-weight="700">Record locally</text>
      <text x="24" y="186" fill="#8fa9c8" font-size="16">Keep a private history for</text>
      <text x="24" y="211" fill="#8fa9c8" font-size="16">recovery and protection.</text>
    </g>
  </g>
  <g fill="#dff8ff">
    <path d="M312 266l12 8-12 8z"/>
    <path d="M592 266l12 8-12 8z"/>
    <path d="M872 266l12 8-12 8z"/>
  </g>
</svg>
